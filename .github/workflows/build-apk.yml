name: Build WorldMind AI APK
on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          java-version: '21'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Install dependencies
        run: npm install --legacy-peer-deps
          
      - name: Build web
        run: |
          npm run build || npm run dev:build || echo "No build script"
          ls -la
          
      - name: Fix web assets folder
        run: |
          echo "Checking for build output..."
          if [ -d "dist" ]; then echo "Found dist"; ls dist; fi
          if [ -d "build" ]; then echo "Found build"; ls build; fi
          if [ -d "www" ]; then echo "Found www"; fi
          
          # Create www if not exists and copy build output to it
          mkdir -p www
          if [ -d "dist" ]; then cp -r dist/* www/ || true; fi
          if [ -d "build" ]; then cp -r build/* www/ || true; fi
          
          # If www still empty, create a basic index.html
          if [ ! -f "www/index.html" ]; then
            echo '<html><body><h1>WorldMind AI</h1><script>window.location.href="/"</script></body></html>' > www/index.html
          fi
          ls -la www/

      - name: Add Android platform
        run: npx cap add android || true

      - name: Sync assets
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorldMind-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
